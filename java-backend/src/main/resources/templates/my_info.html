<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{base :: head('我的信息 - 学籍管理系统')}"></head>
<body>
<nav th:replace="~{base :: navbar}"></nav>
<div class="container-fluid mt-4">
    <div class="page-header">
        <h2><i class="bi bi-person-circle"></i> 我的信息</h2>
    </div>

    <div class="row">
        <!-- 基本信息 -->
        <div class="col-md-4">
            <div class="card mb-4">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0"><i class="bi bi-person"></i> 基本信息</h5>
                </div>
                <div class="card-body">
                    <table class="table table-borderless">
                        <tr><th>学号：</th><td th:text="${student.stuId}"></td></tr>
                        <tr><th>姓名：</th><td th:text="${student.name}"></td></tr>
                        <tr><th>性别：</th><td>
                            <span class="badge"
                                  th:classappend="${student.gender == '男' ? 'badge-gender-male' : 'badge-gender-female'}"
                                  th:text="${student.gender}"></span>
                        </td></tr>
                        <tr><th>出生日期：</th><td th:text="${student.birthDate != null ? student.birthDate : '-'}"></td></tr>
                        <tr><th>联系电话：</th><td th:text="${student.phone != null ? student.phone : '-'}"></td></tr>
                        <tr><th>家庭住址：</th><td th:text="${student.address != null ? student.address : '-'}"></td></tr>
                        <tr><th>入学时间：</th><td th:text="${student.enrollDate}"></td></tr>
                        <tr><th>院系：</th><td th:text="${student.deptName}"></td></tr>
                        <tr><th>专业：</th><td th:text="${student.majorName}"></td></tr>
                        <tr><th>班级：</th><td th:text="${student.className}"></td></tr>
                    </table>
                </div>
            </div>
        </div>

        <!-- 成绩信息 -->
        <div class="col-md-8">
            <div class="card mb-4">
                <div class="card-header bg-success text-white">
                    <h5 class="mb-0"><i class="bi bi-clipboard-data"></i> 我的成绩</h5>
                </div>
                <div class="card-body">
                    <table class="table table-hover table-striped" th:if="${scores != null and !#lists.isEmpty(scores)}">
                        <thead>
                            <tr>
                                <th>课程</th>
                                <th>学分</th>
                                <th>成绩</th>
                                <th>学期</th>
                                <th>考试类型</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="sc : ${scores}">
                                <td th:text="${sc.courseName}"></td>
                                <td th:text="${sc.credit}"></td>
                                <td>
                                    <span class="badge bg-success" th:if="${sc.score >= 90}" th:text="${sc.score}"></span>
                                    <span class="badge bg-primary" th:if="${sc.score >= 60 and sc.score < 90}" th:text="${sc.score}"></span>
                                    <span class="badge bg-danger" th:if="${sc.score < 60}" th:text="${sc.score}"></span>
                                </td>
                                <td th:text="${sc.semester}"></td>
                                <td th:text="${sc.examType}"></td>
                            </tr>
                        </tbody>
                    </table>
                    <p class="text-muted" th:if="${scores == null or #lists.isEmpty(scores)}">暂无成绩记录</p>
                </div>
            </div>

            <!-- 奖惩信息 -->
            <div class="card">
                <div class="card-header bg-warning text-dark">
                    <h5 class="mb-0"><i class="bi bi-award"></i> 我的奖惩记录</h5>
                </div>
                <div class="card-body">
                    <table class="table table-hover table-striped" th:if="${rewards != null and !#lists.isEmpty(rewards)}">
                        <thead>
                            <tr>
                                <th>类型</th>
                                <th>等级</th>
                                <th>描述</th>
                                <th>日期</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="rp : ${rewards}">
                                <td>
                                    <span class="badge bg-success" th:if="${rp.rpType == '奖励'}" th:text="${rp.rpType}"></span>
                                    <span class="badge bg-danger" th:unless="${rp.rpType == '奖励'}" th:text="${rp.rpType}"></span>
                                </td>
                                <td th:text="${rp.level != null ? rp.level : '-'}"></td>
                                <td th:text="${rp.description}"></td>
                                <td th:text="${rp.rpDate}"></td>
                            </tr>
                        </tbody>
                    </table>
                    <p class="text-muted" th:if="${rewards == null or #lists.isEmpty(rewards)}">暂无奖惩记录</p>
                </div>
            </div>
        </div>
    </div>
</div>
<footer th:replace="~{base :: footer}"></footer>
<th:block th:replace="~{base :: scripts}"></th:block>
</body>
</html>
