<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{base :: head(${title + ' - 学籍管理系统'})}"></head>
<body>
<nav th:replace="~{base :: navbar}"></nav>
<div class="container-fluid mt-4">
    <div class="page-header">
        <h2><i class="bi bi-bar-chart"></i> <span th:text="${title}"></span></h2>
        <p class="text-muted" th:text="${description}"></p>
    </div>

    <div class="card">
        <div class="card-body">
            <div th:if="${data != null and !#lists.isEmpty(data)}">
                <div class="table-responsive">
                    <table class="table table-hover table-striped">
                        <thead>
                            <tr>
                                <th:block th:each="header : ${headers}">
                                    <th th:text="${header}"></th>
                                </th:block>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="row : ${data}">
                                <td th:each="col : ${columns}" th:text="${row[col] != null ? row[col] : '-'}"></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <!-- 分页 -->
                <th:block th:if="${totalPages != null}">
                    <div th:replace="~{pagination :: pagination(${page}, ${totalPages}, ${total}, ${queryString})}"></div>
                </th:block>
                <p class="text-muted mt-2" th:unless="${totalPages != null}" th:text="'共 ' + ${#lists.size(data)} + ' 条记录'"></p>
            </div>
            <p class="text-muted" th:if="${data == null or #lists.isEmpty(data)}">暂无数据</p>
        </div>
    </div>

    <div class="mt-3">
        <a href="/" class="btn btn-secondary">
            <i class="bi bi-arrow-left"></i> 返回首页
        </a>
    </div>
</div>
<footer th:replace="~{base :: footer}"></footer>
<th:block th:replace="~{base :: scripts}"></th:block>
</body>
</html>
