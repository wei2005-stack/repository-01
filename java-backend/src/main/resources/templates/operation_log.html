<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{base :: head('操作日志 - 学籍管理系统')}"></head>
<body>
<nav th:replace="~{base :: navbar}"></nav>
<div class="container-fluid mt-4">
<div class="page-header">
    <h2><i class="bi bi-clock-history"></i> 操作日志</h2>
</div>

<!-- 筛选栏 -->
<div class="card mb-3">
    <div class="card-body py-3">
        <form method="get" th:action="@{/logs/}" class="row g-2 align-items-end">
            <div class="col-md-2">
                <label class="form-label mb-1"><small>操作表</small></label>
                <select name="tableName" class="form-select form-select-sm">
                    <option value="">全部表</option>
                    <option th:each="t : ${tables}" th:value="${t}" th:text="${t}"
                            th:selected="${filterTable == t}"></option>
                </select>
            </div>
            <div class="col-md-2">
                <label class="form-label mb-1"><small>操作类型</small></label>
                <select name="operation" class="form-select form-select-sm">
                    <option value="">全部类型</option>
                    <option value="INSERT" th:selected="${filterOperation == 'INSERT'}">INSERT（新增）</option>
                    <option value="UPDATE" th:selected="${filterOperation == 'UPDATE'}">UPDATE（修改）</option>
                    <option value="DELETE" th:selected="${filterOperation == 'DELETE'}">DELETE（删除）</option>
                </select>
            </div>
            <div class="col-md-4">
                <label class="form-label mb-1"><small>搜索（记录ID/内容）</small></label>
                <input type="text" name="keyword" class="form-control form-control-sm"
                       placeholder="输入关键词搜索..." th:value="${filterKeyword}">
            </div>
            <div class="col-md-4">
                <button type="submit" class="btn btn-primary btn-sm me-1">
                    <i class="bi bi-search"></i> 查询
                </button>
                <a th:href="@{/logs/}" class="btn btn-outline-secondary btn-sm">
                    <i class="bi bi-arrow-counterclockwise"></i> 重置
                </a>
            </div>
        </form>
    </div>
</div>

<!-- 日志列表 -->
<div class="card">
    <div class="card-body">
        <div class="mb-2 text-muted">
            <small>共 <span th:text="${#lists.size(logs)}"></span> 条记录</small>
        </div>
        <div class="table-responsive">
            <table class="table table-hover table-striped">
                <thead>
                    <tr>
                        <th>时间</th>
                        <th>操作用户</th>
                        <th>操作类型</th>
                        <th>操作表</th>
                        <th>记录ID</th>
                        <th>旧值</th>
                        <th>新值</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="log : ${logs}">
                        <td><small th:text="${log.opTime}"></small></td>
                        <td th:text="${log.username != null and log.username != '' ? log.username : '-'}"></td>
                        <td>
                            <span class="badge bg-success" th:if="${log.operation == 'INSERT'}">INSERT</span>
                            <span class="badge bg-warning text-dark" th:if="${log.operation == 'UPDATE'}">UPDATE</span>
                            <span class="badge bg-danger" th:if="${log.operation == 'DELETE'}">DELETE</span>
                            <span class="badge bg-secondary" th:if="${log.operation != 'INSERT' and log.operation != 'UPDATE' and log.operation != 'DELETE'}"
                                  th:text="${log.operation}"></span>
                        </td>
                        <td th:text="${log.tableName}"></td>
                        <td th:text="${log.recordId != null ? log.recordId : '-'}"></td>
                        <td><small th:text="${log.oldValue != null and log.oldValue != '' ? log.oldValue : '-'}"></small></td>
                        <td><small th:text="${log.newValue != null and log.newValue != '' ? log.newValue : '-'}"></small></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</div>
<footer th:replace="~{base :: footer}"></footer>
<th:block th:replace="~{base :: scripts}"></th:block>
</body>
</html>
