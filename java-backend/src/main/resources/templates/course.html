<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{base :: head('课程管理 - 学籍管理系统')}"></head>
<body>
<nav th:replace="~{base :: navbar}"></nav>
<div class="container-fluid mt-4">
    <div class="page-header d-flex justify-content-between align-items-center">
        <h2><i class="bi bi-journal-text"></i> 课程管理</h2>
        <a href="/courses/add" class="btn btn-primary"
           th:if="${currentUser.role == 'admin' or currentUser.role == 'academic'}">
            <i class="bi bi-plus-circle"></i> 新增课程
        </a>
    </div>

    <div class="card">
        <div class="card-body">
            <table class="table table-hover table-striped">
                <thead>
                    <tr>
                        <th>课程编号</th>
                        <th>课程名称</th>
                        <th>学分</th>
                        <th>学时</th>
                        <th>课程类型</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="course : ${courses}">
                        <td th:text="${course.courseId}"></td>
                        <td th:text="${course.courseName}"></td>
                        <td th:text="${course.credit}"></td>
                        <td th:text="${course.hours}"></td>
                        <td>
                            <span class="badge"
                                  th:classappend="${course.courseType == '必修' ? 'bg-primary' : 'bg-info'}"
                                  th:text="${course.courseType}"></span>
                        </td>
                        <td>
                            <a th:href="${'/courses/' + course.courseId + '/edit'}"
                               class="btn btn-sm btn-outline-primary btn-action"
                               th:if="${currentUser.role == 'admin' or currentUser.role == 'academic'}">
                                <i class="bi bi-pencil"></i> 编辑
                            </a>
                            <a th:href="${'/courses/' + course.courseId + '/delete'}"
                               class="btn btn-sm btn-outline-danger btn-action"
                               onclick="return confirm('确定删除该课程吗？')"
                               th:if="${currentUser.role == 'admin'}">
                                <i class="bi bi-trash"></i> 删除
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
<footer th:replace="~{base :: footer}"></footer>
<th:block th:replace="~{base :: scripts}"></th:block>
</body>
</html>
