<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{base :: head(${action == 'edit' ? '编辑班级 - 学籍管理系统' : '新增班级 - 学籍管理系统'})}"></head>
<body>
<nav th:replace="~{base :: navbar}"></nav>
<div class="container-fluid mt-4">
    <div class="page-header">
        <h2><i class="bi bi-door-open"></i> [[${action == 'edit' ? '编辑' : '新增'}]]班级</h2>
    </div>

    <div class="card">
        <div class="card-body">
            <form method="post" class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">班级编号</label>
                    <input type="text" name="classId" class="form-control"
                           th:value="${cls != null ? cls.classId : ''}"
                           th:readonly="${action == 'edit'}" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">班级名称</label>
                    <input type="text" name="className" class="form-control"
                           th:value="${cls != null ? cls.className : ''}" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">所属专业</label>
                    <input type="text" class="form-control"
                           th:value="${(cls.deptName ?: '') + ' - ' + (cls.majorName ?: '')}" disabled
                           th:if="${action == 'edit'}">
                    <input type="hidden" name="majorId" th:value="${cls.majorId}"
                           th:if="${action == 'edit'}">
                    <input type="hidden" name="majorId" id="majorId" value=""
                           th:unless="${action == 'edit'}">
                    <div class="dropdown-wrapper" th:unless="${action == 'edit'}">
                        <input type="text" id="majorSearch" class="form-control" placeholder="输入专业名称搜索..."
                               autocomplete="off" required>
                        <div id="majorDropdown" class="dropdown-list">
                            <div th:each="major : ${majors}" class="dropdown-item-custom"
                                 th:attr="data-id=${major.majorId},data-text=${(major.deptName ?: '') + ' - ' + (major.majorName ?: '')}"
                                 th:text="${(major.deptName ?: '') + ' - ' + (major.majorName ?: '')}">
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-md-6">
                    <label class="form-label">入学年份</label>
                    <input type="number" name="enrollYear" class="form-control"
                           th:value="${cls != null ? cls.enrollYear : ''}" required>
                </div>
                <div class="col-12">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check-circle"></i> 保存
                    </button>
                    <a href="/classes/" class="btn btn-secondary">
                        <i class="bi bi-arrow-left"></i> 返回
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>

<style>
.dropdown-wrapper { position: relative; }
.dropdown-list {
    display: none; position: absolute; top: 100%; left: 0; right: 0;
    max-height: 250px; overflow-y: auto; background: #fff;
    border: 1px solid #ced4da; border-top: none;
    border-radius: 0 0 4px 4px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); z-index: 1000;
}
.dropdown-list.show { display: block; }
.dropdown-item-custom {
    padding: 8px 12px; cursor: pointer; border-bottom: 1px solid #f0f0f0;
}
.dropdown-item-custom:hover { background-color: #e9ecef; }
.dropdown-item-custom.selected { background-color: #0d6efd; color: #fff; }
</style>

<script>
function setupDropdown(searchId, dropdownId, hiddenId) {
    const searchInput = document.getElementById(searchId);
    const dropdown = document.getElementById(dropdownId);
    const hiddenInput = document.getElementById(hiddenId);
    const items = dropdown.querySelectorAll('.dropdown-item-custom');

    searchInput.addEventListener('focus', function() { dropdown.classList.add('show'); filterItems(); });
    searchInput.addEventListener('input', function() { filterItems(); hiddenInput.value = ''; });
    document.addEventListener('click', function(e) {
        if (!searchInput.contains(e.target) && !dropdown.contains(e.target)) dropdown.classList.remove('show');
    });
    items.forEach(item => {
        item.addEventListener('click', function() {
            searchInput.value = this.getAttribute('data-text');
            hiddenInput.value = this.getAttribute('data-id');
            dropdown.classList.remove('show');
            items.forEach(i => i.classList.remove('selected'));
            this.classList.add('selected');
        });
    });
    function filterItems() {
        const keyword = searchInput.value.toLowerCase();
        let hasVisible = false;
        items.forEach(item => {
            const text = item.getAttribute('data-text').toLowerCase();
            if (!keyword || text.includes(keyword)) { item.style.display = ''; hasVisible = true; }
            else item.style.display = 'none';
        });
        if (hasVisible) dropdown.classList.add('show');
        else dropdown.classList.remove('show');
    }
    searchInput.addEventListener('keydown', function(e) {
        const visibleItems = Array.from(items).filter(i => i.style.display !== 'none');
        const currentIndex = visibleItems.findIndex(i => i.classList.contains('selected'));
        if (e.key === 'ArrowDown') {
            e.preventDefault();
            const next = currentIndex < visibleItems.length - 1 ? currentIndex + 1 : 0;
            visibleItems.forEach(i => i.classList.remove('selected'));
            if (visibleItems[next]) { visibleItems[next].classList.add('selected'); visibleItems[next].scrollIntoView({block:'nearest'}); }
        } else if (e.key === 'ArrowUp') {
            e.preventDefault();
            const prev = currentIndex > 0 ? currentIndex - 1 : visibleItems.length - 1;
            visibleItems.forEach(i => i.classList.remove('selected'));
            if (visibleItems[prev]) { visibleItems[prev].classList.add('selected'); visibleItems[prev].scrollIntoView({block:'nearest'}); }
        } else if (e.key === 'Enter') {
            e.preventDefault();
            const selected = visibleItems.find(i => i.classList.contains('selected'));
            if (selected) selected.click();
        } else if (e.key === 'Escape') { dropdown.classList.remove('show'); }
    });
}
setupDropdown('majorSearch', 'majorDropdown', 'majorId');
</script>
<footer th:replace="~{base :: footer}"></footer>
<th:block th:replace="~{base :: scripts}"></th:block>
</body>
</html>
