<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{base :: head(${title + ' - 学籍管理系统'})}"></head>
<body>
<nav th:replace="~{base :: navbar}"></nav>
<div class="container-fluid mt-4">
    <div class="page-header">
        <h2><i class="bi bi-bar-chart"></i> <span th:text="${title}"></span></h2>
        <p class="text-muted" th:text="${description}"></p>
    </div>

    <!-- 图表区域 -->
    <div class="row mb-4">
        <!-- 成绩分布饼图 -->
        <div class="col-md-5">
            <div class="card">
                <div class="card-header bg-white">
                    <h5 class="mb-0"><i class="bi bi-pie-chart"></i> 成绩等级分布</h5>
                </div>
                <div class="card-body" style="position: relative; height: 420px;">
                    <canvas id="pieChart"></canvas>
                </div>
            </div>
        </div>
        <!-- 课程成绩柱状图 -->
        <div class="col-md-7">
            <div class="card">
                <div class="card-header bg-white">
                    <h5 class="mb-0">
                        <i class="bi bi-bar-chart-line"></i>
                        <span th:text="${isStudent ? '我的各科成绩' : '各课程平均分'}"></span>
                    </h5>
                </div>
                <div class="card-body" style="position: relative; height: 420px;">
                    <canvas id="barChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <!-- 数据表格 -->
    <div class="card">
        <div class="card-body">
            <div th:if="${data != null and !#lists.isEmpty(data)}">
                <div class="mb-2 text-muted">
                    <small th:text="'共 ' + ${#lists.size(data)} + ' 条记录'"></small>
                </div>
                <div class="table-responsive">
                    <table class="table table-hover table-striped">
                        <thead>
                            <tr>
                                <th:block th:each="header : ${headers}">
                                    <th th:text="${header}"></th>
                                </th:block>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="row : ${data}">
                                <td th:each="col : ${columns}">
                                    <th:block th:if="${col == '成绩' and row[col] != null}">
                                        <span class="badge bg-success" th:if="${row[col] >= 90}" th:text="${row[col]}"></span>
                                        <span class="badge bg-primary" th:if="${row[col] >= 60 and row[col] < 90}" th:text="${row[col]}"></span>
                                        <span class="badge bg-danger" th:if="${row[col] < 60}" th:text="${row[col]}"></span>
                                    </th:block>
                                    <th:block th:unless="${col == '成绩' and row[col] != null}" th:text="${row[col] != null ? row[col] : '-'}"></th:block>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
            <p class="text-muted" th:if="${data == null or #lists.isEmpty(data)}">暂无数据</p>
            <!-- 分页 -->
            <div th:replace="~{pagination :: pagination(${page}, ${totalPages}, ${total}, ${queryString})}"></div>
        </div>
    </div>

    <div class="mt-3">
        <a href="/" class="btn btn-secondary">
            <i class="bi bi-arrow-left"></i> 返回首页
        </a>
    </div>
</div>
<footer th:replace="~{base :: footer}"></footer>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script th:inline="javascript">
const distValues = /*[[${distValues}]]*/ [];
const courseLabels = /*[[${courseLabels}]]*/ [];
const courseValues = /*[[${courseValues}]]*/ [];
const valueLabel = /*[[${isStudent ? '成绩' : '平均分'}]]*/ '成绩';

// 成绩分布饼图
const pieCtx = document.getElementById('pieChart').getContext('2d');
new Chart(pieCtx, {
    type: 'doughnut',
    data: {
        labels: ['优秀(≥90)', '良好(80-89)', '中等(70-79)', '及格(60-69)', '不及格(<60)'],
        datasets: [{
            data: distValues,
            backgroundColor: [
                '#28a745',  // 优秀 - 绿色
                '#4e73df',  // 良好 - 蓝色
                '#ffc107',  // 中等 - 黄色
                '#17a2b8',  // 及格 - 青色
                '#dc3545'   // 不及格 - 红色
            ],
            borderWidth: 2,
            borderColor: '#fff'
        }]
    },
    options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
            legend: {
                position: 'bottom',
                labels: { padding: 15, font: { size: 12 } }
            },
            tooltip: {
                callbacks: {
                    label: function(ctx) {
                        const total = ctx.dataset.data.reduce((a, b) => a + b, 0);
                        const pct = total > 0 ? ((ctx.parsed / total) * 100).toFixed(1) : 0;
                        return ctx.label + ': ' + ctx.parsed + '人 (' + pct + '%)';
                    }
                }
            }
        }
    }
});

// 课程成绩柱状图
const barCtx = document.getElementById('barChart').getContext('2d');
const courseData = courseValues;

new Chart(barCtx, {
    type: 'bar',
    data: {
        labels: courseLabels,
        datasets: [{
            label: valueLabel,
            data: courseData,
            backgroundColor: courseData.map(v => v >= 90 ? '#28a745' : v >= 60 ? '#4e73df' : '#dc3545'),
            borderRadius: 6,
            borderSkipped: false
        }]
    },
    options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
            legend: { display: false },
            tooltip: {
                callbacks: {
                    label: function(ctx) {
                        return valueLabel + ': ' + ctx.parsed.y + '分';
                    }
                }
            }
        },
        scales: {
            y: {
                beginAtZero: true,
                max: 100,
                ticks: { stepSize: 10 },
                title: { display: true, text: '分数' }
            },
            x: {
                ticks: { font: { size: 11 } }
            }
        }
    }
});
</script>
<th:block th:replace="~{base :: scripts}"></th:block>
</body>
</html>
